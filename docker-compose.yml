# Ambiente completo (PostgreSQL + aplicação). Uso:
#   cp .env.example .env   # ajuste APP_SECRET e demais valores
#   docker compose up -d --build
#   docker compose exec app node dist/cli/seed.js   # cria o administrador (SEED_ADMIN_*)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kb -d kb']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD:-troque-esta-senha}@db:5432/kb
      STORAGE_LOCAL_DIR: /data/storage
    ports:
      - '3000:3000'
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:
