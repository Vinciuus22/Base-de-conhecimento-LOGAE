name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kb:kb@localhost:5432/kb_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar ffmpeg (miniaturas de vídeo nos testes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - name: Testes do backend
        run: npm test -w server
      - name: Testes do frontend
        run: npm test -w web
      - name: Build
        run: npm run build
